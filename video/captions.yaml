# 提出動画の字幕・見出しの元テキスト（make_video.py が読む）
# {…} は評価結果の JSON から埋める値。数値を直すときは JSON 側ではなく、ここで言い回しだけ直す。
# P = joint1 正方向 = カメラから見て右（橙の板）、N = 負方向 = 左（青い板）
# 版の呼び方: 動画では v1〜v6 を「第N版」、採用した v7 を「第7版（最終版）」「最終版」と書く
cover:            # --cover で表紙画像を指定したときだけ使う
  duration: 4
  title: CPUで動かす模倣学習の案内アーム
  subtitle:
    - 初期姿勢を変えた教師データの比較と、
    - うまく動かなかった原因の調査

intro:
  duration: 18
  title: どんな作品か
  bullets:
    - 想定する場面：受付や展示会場で、ロボットが行き先（左・右）を腕で指して案内する
    - シミュレータ Gazebo 上の CRANE+ V2（教育用の小型ロボットアーム）で実現
    - AIの役割：模倣学習のACTが、お手本（教師データ）を学んで関節の指令を生成する
    - 手元のPCにGPUがないため、学習から評価までをCPUだけで回せる規模にした
    - 調べたこと：お手本の初期姿勢をばらつかせると、知らない初期姿勢に強くなるか
    - 比べた2条件：A＝初期姿勢を固定したお手本で学習 ／ B＝初期姿勢を変えたお手本で学習

demos:
  - direction: N
    duration: 15
    clip: act_N_A_chunk_rec.mp4
    result: act_N_A_chunk_rec_trial0.json
    lead: 1.5          # 動き出しの何秒前から使うか（録画の実時間）
    label: ← 左
    header: 左（N方向）の青い板を案内
    caption: 最終版のモデル（条件A） ／ Gazebo GUI 内蔵録画（GUIありの録画試行。比較の集計には含めない）
    lines:
      - 最終版のACTが関節指令を生成（お手本のスクリプトは止めている）
      - 1秒分の動きを予測し、その半分（0.5秒分）を実行してから予測し直す
      - この試行では、最初の指令から{reach:.2f} sim秒で目標の±0.05 rad以内に到達
      - sim秒はシミュレーション内の時間。録画中は実時間の約{rtf:.2f}倍で進んだ（映像は等倍）
  - direction: P
    duration: 15
    clip: act_P_A_chunk_rec.mp4
    result: act_P_A_chunk_rec_trial0.json
    lead: 1.5
    label: 右 →
    header: 右（P方向）の橙の板を案内
    caption: 最終版のモデル（条件A） ／ Gazebo GUI 内蔵録画（GUIありの録画試行。比較の集計には含めない）
    lines:
      - 同じ手順で学習した右方向のモデル（左右でモデルを分けている）
      - 左右の選択と初期姿勢への復帰は、AIではなく通常の制御で行う
      - この試行では、最初の指令から{reach:.2f} sim秒で目標の±0.05 rad以内に到達
      - 成功の条件：腕の4関節が目標から0.05 rad以内を0.5秒保つこと（8秒以内）

pipeline:
  duration: 18
  title: 学習と実行の流れ
  boxes:
    - "教師スクリプト\n等速補間で目標へ"
    - "Gazebo上のCRANE+\n（ros2_control）"
    - "rosbagに記録\n指令と実測・sim時刻"
    - "LeRobot形式へ変換\n20Hz・関節名で整列"
    - "ACTを学習\nCPU・2000更新"
    - "推論ノード\n20Hz・チャンク実行"
  notes:
    - AIの担当：案内動作の関節指令の生成（ACT）
    - 通常の制御の担当：左右の選択（引数）、初期姿勢への復帰、成功判定
    - お手本は人の操作ではなく、スクリプトで生成したもの
    - 各方向20本のお手本：収集 約4分、学習 約15分（CPU 8スレッド）

failures:
  - duration: 12
    kicker: うまく動かなかった原因の調査（1/3）
    title: 改良1：腕がほとんど動かずに止まる
    items:
      - [観測, 基準姿勢の近くで止まった（joint1 ≈ 0.09 rad）]
      - [検査, 止まった姿勢で joint2 だけを 0 → −0.0005 rad に変えると、予測が 0.09 → 0.62 rad に跳んだ]
      - [原因の候補, ほぼ一定の関節は標準偏差が0に近く、正規化で微小なたわみが大きな信号になる]
      - [対策, 正規化の標準偏差に下限（0.05 rad）を設けた]
  - duration: 12
    kicker: うまく動かなかった原因の調査（2/3）
    title: 改良2：動き出しで逆向きに動く・止まる
    figure: fail_traj
    items:
      - [観測, 初期姿勢で逆向きの指令、または初期姿勢の近くで停止（版や左右で結果が違った）]
      - [原因の候補, 同じ初期姿勢に「止まれ」「動け」の両方のお手本が付いていたこと。動き出しの指令が小さすぎた可能性]
      - [対策, お手本の冒頭の静止区間を除き、お手本の動きを等速に変更]
  - duration: 11
    kicker: うまく動かなかった原因の調査（3/3）
    title: 改良3：1秒分をまとめて予測して実行する
    figure: fail_traj
    items:
      - [観測, 1ステップずつ実行すると、初期姿勢での動き出しが学習誤差と同程度で成否が不安定]
      - [対策, 20ステップ（1秒分）を予測し、うち10ステップ（0.5秒分）を実行してから予測し直す]
      - [結果, 第7版（最終版）で、基準姿勢から左右とも3回中3回成功]
      - [注意, 7回作り直して選んだ構成。原因は検査からの推定で、完全な証明ではない]

comparison:
  - duration: 15
    title: 比較：初期姿勢をばらつかせたお手本で、知らない姿勢に強くなるか
    figure: poses
    lines:
      - "A：初期姿勢を基準姿勢に固定した20本のお手本"
      - "B：初期姿勢を変えた20本のお手本（joint1 ±0.15・joint3 0〜0.10 rad の範囲）"
      - "その他（動き・前処理・学習量・判定）はAと共通"
      - "評価：学習に使っていない20姿勢を事前に決め、AとBに同じ姿勢を与えた（20姿勢 × 左右 × A/B ＝ 80試行）"
  - duration: 15
    title: 比較の結果（GUIなし・80試行）
    figure: reach
    notes:
      - "同じ姿勢で A だけ成功：{a_only}件／B だけ成功：{b_only}件（左右合計）"
      - "到達時間は B が長かった（右 +{dP:.2f} 秒、左 +{dN:.2f} 秒、同じ姿勢どうしの平均）"
      - "時間はsim秒。理由は未検証（学習seedが1つのため条件の効果と区別できない）"

conclusion:       # 行頭の ! は強調（太字・色付き）。small は小さめの注記
  duration: 18
  title: 今回の結論
  sections:
    - head: できたこと
      lines:
        - "!CPUだけで、AI（ACT）による左右の案内動作を学習・実行できた"
    - head: 比較で分かったこと
      lines:
        - A＝固定姿勢で学習 ／ B＝初期姿勢を変えて学習。左右ともA・B各20/20成功
        - "!Bによる成功率の改善は確認できなかった"
        - 到達時間と残った誤差は、今回のモデルではAの方が小さかった
    - head: 検証の範囲
      small: true
      lines:
        - 未使用の初期姿勢20個、学習の乱数条件（seed）は各1通り
        - 範囲外・別の乱数条件は未検証で、結論は今回の条件に限る

bgm_credit: BGM：「遠い港の夜景」 作曲：甘茶（甘茶の音楽工房）
